[package]
name = "diffo"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Terminal Git diff review with persistent comments and reviewed state"
repository = "https://github.com/ekil1100/diffo"
build = "build.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.29"
process-wrap = { version = "10", default-features = false, features = ["std", "process-group", "job-object"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tree-sitter = "0.26.7"
tree-sitter-language = "0.1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
strip = true
